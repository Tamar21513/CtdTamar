name: ctd-local

services:
  postgres:
    image: postgres:17.7-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctd}
      POSTGRES_USER: ${POSTGRES_USER:-ctd_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -p
      - "${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -p ${POSTGRES_PORT:-5432}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7.4.10-alpine3.21
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - "${REDIS_PORT:-6379}"
        - ping
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend

  api-gateway:
    build:
      context: ./server/api_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctd}
      POSTGRES_USER: ${POSTGRES_USER:-ctd_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8000}
      CTD_GAME_SERVER_HOST: ${CTD_GAME_SERVER_HOST:-host.docker.internal}
      CTD_GAME_SERVER_PORT: ${CTD_GAME_SERVER_PORT:-5050}
      CTD_GAME_SERVER_SHARDS: ${CTD_GAME_SERVER_SHARDS:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ctd_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      LOG_DIR: ${LOG_DIR:-/app/logs}
    volumes:
      - api_gateway_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_GATEWAY_BIND_HOST:-0.0.0.0}:${API_GATEWAY_PORT:-8000}:${API_GATEWAY_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:' + os.environ['API_GATEWAY_PORT'] + '/health',
          timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  postgres-test:
    image: postgres:17.7-alpine3.22
    profiles: ["test"]
    environment:
      POSTGRES_DB: ctd_test
      POSTGRES_USER: ctd_test
      POSTGRES_PASSWORD: ctd_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctd_test -d ctd_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - backend

  redis-test:
    image: redis:7.4.10-alpine3.21
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
    networks:
      - backend

  api-gateway-test:
    profiles: ["test"]
    build:
      context: ./server/api_gateway
      dockerfile: Dockerfile
      target: test
    environment:
      POSTGRES_DB: ctd_test
      POSTGRES_USER: ctd_test
      POSTGRES_PASSWORD: ctd_test_only
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_DB: 0
      SESSION_COOKIE_NAME: ctd_session
      SESSION_TTL_SECONDS: 3600
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
      CTD_GAME_SERVER_HOST: host.docker.internal
      CTD_GAME_SERVER_PORT: 5050
      LOG_DIR: /app/logs
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_gateway_logs:
