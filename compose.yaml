name: ctd-local

services:
  postgres:
    image: postgres:17.7-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctd}
      POSTGRES_USER: ${POSTGRES_USER:-ctd_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -p
      - "${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -p ${POSTGRES_PORT:-5432}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7.4.10-alpine3.21
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - "${REDIS_PORT:-6379}"
        - ping
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend

  api-gateway:
    build:
      context: ./server/api_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctd}
      POSTGRES_USER: ${POSTGRES_USER:-ctd_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8000}
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8000}:${API_GATEWAY_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:' + os.environ['API_GATEWAY_PORT'] + '/health',
          timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
